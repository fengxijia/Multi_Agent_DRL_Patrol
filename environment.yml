# Modern conda environment (recommended).
#   conda env create -n marl_patrol -f environment.yml
#   conda activate marl_patrol
#   pip install -e .
name: marl_patrol
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - numpy>=1.21,<2.0
      - torch>=2.1
      - gymnasium>=0.29
      - networkx>=2.6,<3.0
      - matplotlib>=3.5
      - scikit-learn>=1.1
      - imageio>=2.19
      - tensorboard>=2.11
