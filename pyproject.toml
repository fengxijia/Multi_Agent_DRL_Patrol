[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-patrol"
version = "0.2.0"
description = "Multi-agent deep RL (PPO) for the multi-robot patrolling problem (MRPP)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Xijia Feng" },
    { name = "Jiawei Cao" },
    { name = "Yiding Ma" },
]
keywords = ["reinforcement-learning", "multi-agent", "patrolling", "ppo"]

# Modern, supported stack. numpy is pinned < 2.0 and networkx < 3.0 because the
# environment relies on np.matrix / .A and the networkx 2.x adjacency-matrix API.
dependencies = [
    "numpy>=1.21,<2.0",
    "torch>=2.1",
    "gymnasium>=0.29",
    "networkx>=2.6,<3.0",
    "matplotlib>=3.5",
    "scikit-learn>=1.1",
    "imageio>=2.19",
    "tensorboard>=2.11",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "black>=24.0", "pytest>=7.0"]

[project.scripts]
marl-patrol = "marl_patrol.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear.
select = ["E", "F", "I", "UP", "B"]
# The ported research code keeps some original names/locals; don't fail on them.
ignore = ["E501", "E741", "B007", "N"]
